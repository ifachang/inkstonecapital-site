name: Deploy Static Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Check FTP_SERVER secret
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: test -n "$FTP_SERVER"

      - name: Check FTP_USERNAME secret
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: test -n "$FTP_USERNAME"

      - name: Check FTP_PASSWORD secret
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: test -n "$FTP_PASSWORD"

      - name: Check FTP_SERVER_DIR secret
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: test -n "$FTP_SERVER_DIR"

      - name: Deploy to web server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
