name: Deploy Static Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Check FTP_SERVER secret
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: test -n "$FTP_SERVER"

      - name: Check FTP_USERNAME secret
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: test -n "$FTP_USERNAME"

      - name: Check FTP_PASSWORD secret
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: test -n "$FTP_PASSWORD"

      - name: Check FTP_SERVER_DIR secret
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: test -n "$FTP_SERVER_DIR"

      - name: Deploy to web server via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          for required in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!required}" ]; then
              echo "::error::$required is not configured"
              exit 1
            fi
          done

          remote_dir="${FTP_SERVER_DIR#/}"
          remote_dir="${remote_dir%/}"

          find out -type f ! -name ".DS_Store" ! -name "Thumbs.db" -print0 |
            while IFS= read -r -d '' file; do
              rel="${file#out/}"
              curl --silent --show-error --fail --ftp-create-dirs \
                --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                -T "$file" \
                "ftp://${FTP_SERVER}/${remote_dir}/${rel}"
            done
